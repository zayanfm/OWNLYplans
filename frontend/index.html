function monthlyShare(splitPct) {
  return Math.round(FINANCE.monthlySurplus * splitPct / 100);
}

function formatSurplus(amount) {
  return `S$${amount.toLocaleString('en-SG')}`;
}

function getChatResponse(msg, ctx) {
  const m = msg.toLowerCase();
  const match = CHAT_INTENTS.find(rule => rule.test.test(m));
  if (match) return match.reply(ctx);
  return CHATBOT_RESPONSES[Math.floor(Math.random() * CHATBOT_RESPONSES.length)];
}

function buildWelcomeMessage(ctx) {
  return {
    from: 'ai',
    text: `Hi ${USER.first}! 👋 Your ${ctx.planLabel} ${ctx.goalType==='shared'?'Shared ':''}AI Life Plan is active. You're contributing ${ctx.split}% (S$${ctx.maryMonthly}/mo)${ctx.goalType==='shared'?` and ${USER.partner} ${ctx.partnerSplit}% (S$${ctx.zayanMonthly}/mo)`:''} toward your goals. What would you like to know?`,
  };
}

  return new Date().toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit',hour12:false});

   SCREEN 5 — Partner Invitation Waiting (5-second countdown)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function PlannerWaiting({ partnerAccount, onComplete }) {
  const [secs, setSecs] = useState(5);

  useEffect(() => {
    const iv = setInterval(() => {
      setSecs(s => {
        if (s <= 1) { clearInterval(iv); onComplete(); return 0; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, []);

  return (
    <div className="panel bg-[#F5F4F0] flex flex-col">
      <StatusBar dark={false} />
      <div className="px-5 pb-3">
        <p className="text-[#1A1A1A] font-bold text-base">Invitation Sent</p>
        <p className="text-[#767676] text-[10px]">Account {partnerAccount}</p>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-8">
        {/* Pulsing ring spinner */}
        <div className="relative flex items-center justify-center mb-8" style={{width:120,height:120}}>
          <div className="absolute inset-0 rounded-full bg-[#D81E05]/10 ping"/>
          <div className="absolute rounded-full bg-[#D81E05]/20" style={{inset:16, animation:'pingRing 1.4s ease-out 0.4s infinite'}}/>
          <div className="w-16 h-16 rounded-full bg-white border-2 border-[#D81E05] flex items-center justify-center" style={{zIndex:2}}>
            <span className="text-3xl">👫</span>
          </div>
        </div>

        <p className="text-[#1A1A1A] font-black text-xl text-center mb-2">Waiting for partner</p>
        <p className="text-[#767676] text-sm text-center leading-relaxed mb-8">
          Waiting for partner to accept invitation...
        </p>

      </div>
    </div>
  );
}

              <div className="flex items-center justify-center font-bold text-white text-sm" style={{width:`${partnerPct}%`, background:'#7AB5E8', transition:'width 0.05s'}}>

              { val:'10', label:'10-Year Plan', sub:'Long-term wealth · Family, property, retirement prep' },

              <button key={o.val} onClick={() => setTimeline(o.val)}

/* ── Chatbot Overlay — context-aware ── */
function ChatbotOverlay({ onClose, setup }) {
  const { timeline='5', split=60, goalType='shared' } = setup || {};
  const planLabel    = `${timeline}-Year`;
  const partnerSplit = 100 - split;
  const maryMonthly  = Math.round(1340 * split / 100);
  const zayanMonthly = Math.round(1340 * partnerSplit / 100);

  function getResponse(msg) {
    const m = msg.toLowerCase();
    if (/split|contribut/.test(m))
      return `Your plan has Mary contributing ${split}% (S$${maryMonthly}/mo) and ${goalType==='shared'?`Zayan ${partnerSplit}% (S$${zayanMonthly}/mo)`:'100% solo'}. This auto-routes into your shared MMF.`;
    if (/bto|home|hdb/.test(m))
      return `Your BTO Goal Pot is at S$40,800 (68% of S$60K target). On the current ${planLabel} plan you're on track to hit it 2 months early. OWNLYplans is routing +S$200/mo there.`;
    if (/year|timeline|horizon/.test(m))
      return `You're on a ${planLabel} plan. By Year ${timeline} the AI projects +S$${timeline==='5'?'200K':'500K'} in net wealth assuming 3.85% MMF yield and your current surplus.`;
    if (/partner|zayan/.test(m))
      return goalType==='shared'
        ? `Zayan is linked and contributing ${partnerSplit}% (S$${zayanMonthly}/mo). Combined monthly contribution is S$1,340 routed via your shared pot.`
        : `You're on a Personal Goals plan — no partner linked. You can add a partner later from Plan settings.`;
    if (/protect|insur/.test(m))
      return `OWNLYplans detected a S$160K protection gap. Great Eastern FlexiLife Term is recommended at S$28/mo. Tap the "OCBC Recommends" card to view the quote.`;
    if (/surplus|mmf|cash/.test(m))
      return `Your monthly surplus is S$1,340 — S$1,000 → LionGlobal MMF (3.85%), S$200 → BTO Goal Pot, S$140 → FRANK auto-pay. Nothing sits idle in your 360 Account.`;
    if (/invest|portfolio/.test(m))
      return `Your investment portfolio is at S$18,450 (37% of S$50K target). LionGlobal MMF is the primary vehicle at 3.85% p.a. You can upgrade to equity exposure via OWNLYplans at any time.`;
    return CHATBOT_RESPONSES[Math.floor(Math.random() * CHATBOT_RESPONSES.length)];
  }

  const [messages, setMessages] = useState([
    { from:'ai', text:`Hi Mary! 👋 Your ${planLabel} ${goalType==='shared'?'Shared ':''}AI Life Plan is active. You're contributing ${split}% (S$${maryMonthly}/mo)${goalType==='shared'?` and Zayan ${partnerSplit}% (S$${zayanMonthly}/mo)`:''} toward your goals. What would you like to know?` }
  ]);
  const [input, setInput]   = useState('');
  const [typing, setTyping] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, typing]);

  function send(txt) {
    const text = (txt || input).trim();
    if (!text) return;
    setInput('');
    const newMsgs = [...messages, { from:'user', text }];
    setMessages(newMsgs);
    setTyping(true);
    setTimeout(() => {
      setMessages(m => [...m, { from:'ai', text:getResponse(text) }]);
      setTyping(false);
    }, 900 + Math.random() * 300);
  }

  return (
    <div className="help-overlay" style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.55)', zIndex:200}}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="chat-drawer" style={{position:'absolute', bottom:0, left:0, right:0, height:'84%', display:'flex', flexDirection:'column', background:'#F5F4F0'}}>

        {/* Chat header */}
        <div style={{background:'#1A1A1A', padding:'14px 18px', display:'flex', alignItems:'center', gap:12, flexShrink:0}}>
          <div style={{width:38, height:38, borderRadius:'50%', background:'#D81E05', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20}}>🤖</div>
          <div style={{flex:1}}>
            <p style={{color:'white', fontWeight:800, fontSize:14, margin:0}}>OWNLYplans AI</p>
            <div style={{display:'flex', alignItems:'center', gap:6, marginTop:2}}>
              <div style={{width:6, height:6, borderRadius:'50%', background:'#4ade80', animation:'pulse 1.8s ease-in-out infinite'}}/>
              <p style={{color:'rgba(255,255,255,0.45)', fontSize:10, margin:0}}>Active · Your {planLabel} Plan</p>
            </div>
          </div>
          <button onClick={onClose}
            style={{width:32, height:32, borderRadius:'50%', background:'rgba(255,255,255,0.12)', border:'none', cursor:'pointer', color:'white', fontSize:14, fontWeight:'bold', display:'flex', alignItems:'center', justifyContent:'center'}}
            className="tap">✕</button>
        </div>

        {/* Messages */}
        <div className="scrollable flex-1" style={{padding:'14px 14px 8px', display:'flex', flexDirection:'column', gap:12}}>
          {messages.map((msg, i) => (
            <div key={i} style={{display:'flex', justifyContent:msg.from==='user'?'flex-end':'flex-start', alignItems:'flex-end', gap:8}}>
              {msg.from==='ai' && (
                <div style={{width:28, height:28, borderRadius:'50%', background:'#D81E05', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:14}}>🤖</div>
              )}
              <div className={msg.from==='user' ? 'bubble-user' : 'bubble-ai'} style={{maxWidth:'76%'}}>
                {msg.text}
              </div>
            </div>
          ))}
          {typing && (
            <div style={{display:'flex', alignItems:'flex-end', gap:8}}>
              <div style={{width:28, height:28, borderRadius:'50%', background:'#D81E05', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14}}>🤖</div>
              <div className="bubble-ai" style={{padding:'10px 16px'}}>
                <div style={{display:'flex', gap:4, alignItems:'center', height:16}}>
                  {[0,1,2].map(j => (
                    <div key={j} style={{width:6, height:6, borderRadius:'50%', background:'#BBBBBB', animation:`pulse 1.2s ease-in-out ${j*0.22}s infinite`}}/>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>

        {/* Quick prompts */}
        <div style={{padding:'8px 12px 0', display:'flex', gap:8, overflowX:'auto', flexShrink:0}} className="hscroll">
          {['BTO progress?','Split breakdown?','Protection gap?','Monthly surplus?'].map(q => (
            <button key={q} onClick={() => send(q)}
              style={{flexShrink:0, background:'white', border:'1.5px solid #E8E8E8', borderRadius:20, padding:'6px 14px', fontSize:11, fontWeight:600, color:'#1A1A1A', cursor:'pointer', whiteSpace:'nowrap'}}
              className="tap">
              {q}
            </button>
          ))}
        </div>

        {/* Input row */}
        <div style={{padding:'10px 14px 20px', background:'white', borderTop:'1px solid #E8E8E8', display:'flex', gap:10, alignItems:'center', flexShrink:0}}>
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && send(input)}
            placeholder="Ask your AI planner…"
            style={{flex:1, background:'#F5F4F0', border:'none', borderRadius:18, padding:'11px 16px', fontSize:13, outline:'none', fontFamily:'inherit', color:'#1A1A1A'}}
          />
          <button onClick={() => send()} disabled={!input.trim()}
            style={{width:44, height:44, borderRadius:'50%', background:input.trim()?'#D81E05':'#E8E8E8', border:'none', cursor:input.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background 0.2s'}}
            className="tap">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M2 9h14M10 4l5 5-5 5" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── AI Planner Flow Controller ── */
function AIPlannerFlow({ onNav, onComplete, initialStep='terms', onBackToLanding }) {
  const [step,           setStep]           = useState(initialStep);
  const [goalType,       setGoalType]       = useState('shared');
  const [partnerAccount, setPartnerAccount] = useState('');
  const [split,          setSplit]          = useState(60);
  const [timeline,       setTimeline]       = useState('5');
  const [goals,          setGoals]          = useState(['BTO (Build-To-Order)', 'Car', 'Retirement Planning', 'Education']);
  const [aiTier,         setAiTier]         = useState('medium');

  if (step==='terms')      return <PlannerTerms    onAgree={()=>setStep('profile')} onBack={()=> onBackToLanding ? onBackToLanding() : onNav('home')} />;
  if (step==='profile')    return <PlannerProfile  onNext={()=>setStep('goalSelect')} onBack={()=>setStep('terms')} />;
  if (step==='goalSelect') return <PlannerGoalSelect
                                    onPersonal={()=>{ setGoalType('personal'); setStep('config'); }}
                                    onShared={acct=>{ setGoalType('shared'); setPartnerAccount(acct); setStep('waiting'); }}
                                    onBack={()=>setStep('profile')} />;
  if (step==='waiting')    return <PlannerWaiting  partnerAccount={partnerAccount} onComplete={()=>setStep('config')} />;
  if (step==='config')     return <PlannerConfig   goalType={goalType}
                                    onComplete={({split:s,timeline:t,goals:g,aiTier:a})=>{ setSplit(s); setTimeline(t); setGoals(g); setAiTier(a); setStep('loading'); }}
                                    onBack={()=>setStep(goalType==='shared'?'waiting':'goalSelect')} />;
  if (step==='loading')    return <PlannerLoading  onComplete={()=>setStep('output')} />;
  if (step==='output')     return <PlannerOutput   timeline={timeline} split={split} goalType={goalType}
                                    onApprove={()=>onComplete({ goalType, partnerAccount, split, timeline, goals, aiTier })}
                                    onBack={()=>setStep('config')} />;
  return null;
}

/* ═══════════════════════════════════════════════════════════════════
   ROOT APP — manages screen routing + global help portal state
═══════════════════════════════════════════════════════════════════ */
function App() {
  const [screen,       setScreen]       = useState('home');
  const [showHelp,     setShowHelp]     = useState(false);
  const [planSetup,    setPlanSetup]    = useState(null);
  const [planStarted,  setPlanStarted]  = useState(false);

  function nav(to) {
    setScreen(to);
    // Leaving the plan tab resets the wizard so landing shows fresh next visit
    if (to !== 'plan') setPlanStarted(false);
  }

  const onPlan        = screen === 'plan';
  const inWizard      = onPlan && planStarted && !planSetup;
  const onDashboard   = onPlan && !!planSetup;
  const onLanding     = onPlan && !planStarted && !planSetup;

  return (
    <div style={{position:'absolute', inset:0}}>
      {screen === 'ownly' && <OwnlyScreen onNav={nav} onHelp={() => setShowHelp(true)} />}
      {screen === 'home'  && <HomeScreen  onOwnly={() => nav('ownly')} onNav={nav} />}

      {/* Plan tab — landing: embedded with BottomNav, no back btn */}
      {onLanding && (
        <PlanLandingTab onStart={() => setPlanStarted(true)} onNav={nav} />
      )}

      {/* Plan tab — wizard: full-screen, BottomNav hidden */}
      {inWizard && (
        <AIPlannerFlow
          onNav={nav}
          onComplete={setup => { setPlanSetup(setup); }}
          onBackToLanding={() => setPlanStarted(false)}
        />
      )}

      {/* Plan tab — active dashboard */}
      {onDashboard && (
        <AIPlanDashboard setup={planSetup} onNav={nav} />
      )}

      {/* Help FAB — hidden during wizard and on dashboard (has its own chatbot FAB) */}
      {!inWizard && !onDashboard && <HelpFAB onClick={() => setShowHelp(true)} />}

      {showHelp && <HelpPortal onClose={() => setShowHelp(false)} />}
    </div>
  );
}
